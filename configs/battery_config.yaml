# PolarGrid AI - Battery Energy Storage Configuration
# Simulated lithium-ion battery bank for polar research station

battery:
  capacity_kwh: 500.0          # Total battery bank capacity
  soc_min: 0.10                # Minimum state of charge (10%)
  soc_max: 0.90                # Maximum state of charge (90%)
  soc_initial: 0.50            # Initial SOC for simulation start
  charge_efficiency: 0.92      # Charging efficiency
  discharge_efficiency: 0.92   # Discharging efficiency
  max_charge_power_kw: 100.0   # Maximum charging power
  max_discharge_power_kw: 100.0 # Maximum discharging power
  degradation_cost_per_kwh: 0.02  # USD per kWh throughput (cycle degradation)
  cold_derating_threshold_c: -20.0  # Temperature below which capacity derates
  cold_derating_factor: 0.005  # Capacity loss per degree below threshold (0.5%/°C)

# Note: These parameters represent a hypothetical battery installation.
# Real Antarctic station battery systems would require cold-weather rated cells.
